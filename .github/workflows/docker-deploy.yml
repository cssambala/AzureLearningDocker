name: Build and Deploy Docker App

on:
  push:
    branches:
      - master

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build --no-cache -t cssambala/azurelearningdocker:${{ github.run_number }} .

      - name: Push Docker Image
        run: |
          docker push cssambala/azurelearningdocker:${{ github.run_number }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart Azure Container App
        run: |
          az containerapp update \
            --name azurelearningcontainerapp \
            --resource-group AzureLearningRG \
            --image cssambala/azurelearningdocker:${{ github.run_number }}
version: '3.8'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: sqlservercontainer

    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

  webapp:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: azurelearningcontainer

    ports:
      - "8080:8080"

    depends_on:
      - sqlserver

volumes:
  sql_data: